# Firebase web config is a public project identifier, not a credential.
# `next build` with output:"export" bakes NEXT_PUBLIC_* into the static bundle,
# so this key is already served to every visitor of the deployed CMS — and this
# repository is public. Secret scanning matches the `AIza…` shape and cannot
# tell a Firebase web key from a server-side Google Cloud key, so it reopens the
# same alert on every push. The security boundary is Firebase Auth +
# firestore.rules. See apps/cms/.env.production's header and apps/cms/README.md.
paths-ignore:
  - "apps/cms/.env.production"
